<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embobinados del Guaviare - Catálogos de Productos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blueDark: '#1b3c87',
                            blueLight: '#32a3df',
                            orange: '#d94b1a',
                            grayDark: '#1e293b',
                            grayLight: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- HEADER / IDENTIDAD -->
    <header class="bg-gradient-to-r from-brand-blueDark via-slate-900 to-brand-blueDark text-white shadow-xl border-b-4 border-brand-orange sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-xl shadow-lg border border-brand-orange flex items-center justify-center flex-shrink-0">
                    <svg class="w-10 h-6 text-brand-orange" viewBox="0 0 100 40" fill="currentColor">
                        <path d="M5 10 h18 a5 5 0 0 1 5 5 v15 a5 5 0 0 1 -5 5 h-18 a5 5 0 0 1 -5 -5 v-15 a5 5 0 0 1 5 -5 z" fill="#d94b1a" />
                        <path d="M8 10 q -5 -8 5 -10 h 10 q 5 0 3 10" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
                        <path d="M28 18 h55 q 5 0 5 4 q 0 4 -5 4 h-55" fill="#f3f4f6" stroke="#374151" stroke-width="2" />
                        <rect x="7" y="15" width="4" height="10" rx="1" fill="#fff" opacity="0.8" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-black tracking-tight flex items-center gap-2">
                        <span>EMBOBINADOS</span>
                        <span class="text-brand-orange text-[10px] bg-white px-2 py-0.5 rounded-full font-extrabold shadow">DEL GUAVIARE</span>
                    </h1>
                    <p class="text-[10px] sm:text-[11px] text-brand-blueLight font-semibold tracking-wider uppercase">Portal de Catálogos & Precios • San José del Guaviare</p>
                </div>
            </div>

            <div class="flex items-center gap-2 bg-slate-800/90 px-3 py-1.5 rounded-xl border border-slate-700 text-xs">
                <i class="fa-solid fa-book-bookmark text-brand-orange"></i>
                <span class="text-slate-300 font-medium">Catálogos:</span>
                <span class="bg-brand-orange text-white font-bold px-2 py-0.5 rounded-md text-[11px]">18 Listas Activas</span>
            </div>
        </div>
    </header>

    <!-- MAIN INTERACTIVE SPACE -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 lg:px-8 space-y-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="relative w-full sm:max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="catalog-search" oninput="filterCatalogs()" placeholder="Buscar catálogo por producto, marca o empresa..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-brand-blueDark focus:bg-white focus:outline-none transition-all shadow-sm">
            </div>
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-500">
                <span>Orden: </span>
                <span class="text-brand-orange font-bold flex items-center gap-1">
                    <i class="fa-solid fa-arrow-down-a-z"></i> Alfabético (A-Z)
                </span>
            </div>
        </div>

        <div id="catalogs-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Cargado por JS -->
        </div>
    </main>

    <!-- VISOR DIRECTO Y UNIVERSAL -->
    <div id="pdf-viewer-overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex flex-col">
        <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between border-b border-slate-800 shadow-md">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="p-2 bg-brand-orange rounded-lg flex-shrink-0">
                    <i class="fa-solid fa-file-pdf text-white text-sm"></i>
                </div>
                <div class="truncate">
                    <h2 class="font-extrabold text-xs sm:text-sm text-slate-100 truncate" id="viewer-title">Visualizando Catálogo</h2>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider font-mono truncate" id="viewer-filename">archivo.pdf</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a id="btn-direct-link" target="_blank" class="px-3 py-1.5 bg-brand-orange hover:bg-orange-600 text-white text-xs font-bold rounded-lg transition-colors flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-up-right-from-square"></i> Abrir PDF Directo
                </a>
                <button onclick="closePDFViewer()" class="px-3 py-1.5 bg-slate-800 hover:bg-red-600 text-slate-200 hover:text-white text-xs font-bold rounded-lg transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-xmark"></i> Cerrar
                </button>
            </div>
        </div>

        <div class="flex-grow w-full h-full bg-slate-950 relative" id="pdf-container">
            <!-- El iframe se genera dinámicamente -->
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
            <p class="font-extrabold text-slate-300">EMBOBINADOS DEL GUAVIARE</p>
            <p class="text-[11px]">San José del Guaviare, Colombia • Soporte Técnico de Precisión</p>
        </div>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        const CATALOGS_DATABASE = [
            { id: "cap-duales", filename: "CAP DUALES EM 370-440 MAR 2026.pdf", title: "Lista de Productos Capacitadores Duales EM", company: "Electromecánicos EM", category: "Capacitadores", year: "2026" },
            { id: "cap-em", filename: "CAP EM P.D 2025-2026.pdf", title: "Lista de Productos Capacitadores EM P.D.", company: "P.D. Representaciones", category: "Capacitadores", year: "2025-2026" },
            { id: "aquatrece", filename: "Lista de Precios Aquatrece Colombia 2025.pdf", title: "Lista de Productos Aquatrece Colombia", company: "Aquatrece Colombia S.A.S.", category: "Sistemas de Bombeo", year: "2025" },
            { id: "lista-barnes", filename: "Lista de Precios Barnes.pdf", title: "Lista de Productos Barnes", company: "Barnes de Colombia S.A.S.", category: "Sistemas de Bombeo", year: "2025-2026" },
            { id: "lista-consorcio", filename: "Lista Productos_ 2024.pdf", title: "Lista de Productos Consorcio", company: "Consorcio Industrial S.A.S.", category: "Equipos & Motores Consorcio", year: "2024" },
            { id: "lista-energia-potencia", filename: "Lista de Precios Energia y Potencia.pdf", title: "Lista de Productos Energía y Potencia", company: "Energía y Potencia S.A.S.", category: "Motores & Maquinaria", year: "2025" },
            { id: "lista-forte", filename: "catalogo_2025_digital.pdf", title: "Lista de Productos Forte 2025", company: "Global Motor S.A.S.", category: "Maquinaria & Agro", year: "2025" },
            { id: "lista-hidroimportacion", filename: "Lista de Precios Hidroimportacion Colombia.pdf", title: "Lista de Productos Hidroimportación Colombia", company: "Hidroimportación Colombia", category: "Sistemas de Bombeo", year: "2026" },
            { id: "lista-ihm", filename: "Lista de precios IHM.pdf", title: "Lista de Productos IHM 2026", company: "Ignacio Gómez IHM S.A.S.", category: "Sistemas de Bombeo IHM", year: "2026" },
            { id: "lista-pedrollo", filename: "Lista de Precios Pedrollo.pdf", title: "Lista de Productos Pedrollo", company: "Pedrollo S.p.A. Colombia", category: "Sistemas de Bombeo", year: "2025-2026" },
            { id: "lista-penagos", filename: "Lista de Precios Penagos.pdf", title: "Lista de Productos Penagos", company: "Penagos Hermanos S.A.", category: "Maquinaria Agrícola", year: "2026" },
            { id: "lista-stihl", filename: "Lista de Precios Stihl.pdf", title: "Lista de Productos Stihl", company: "Stihl Colombia S.A.S.", category: "Motosierras & Guadañadoras", year: "2026" },
            { id: "lista-trapp", filename: "Lista de Precios Trapp.pdf", title: "Lista de Productos Trapp", company: "Metalúrgica Trapp Ltda.", category: "Jardinería y Picadoras", year: "2025" },
            { id: "lista-yamaha-motores", filename: "Lista de Productos Yamaha Motores.pdf", title: "Lista de Productos Yamaha Motores", company: "Incolmotores Yamaha S.A.", category: "Motores & Generadores", year: "2026" },
            { id: "lista-yamaha-repuestos", filename: "Lista de Productos Yamaha Repuestos.pdf", title: "Lista de Productos Yamaha Repuestos", company: "Incolmotores Yamaha S.A.", category: "Repuestos Originales", year: "2026" },
            { id: "k-seal", filename: "PRECIOS ESPECIALES K SEAL 2025.pdf", title: "Lista de Productos K-Seal", company: "K-Seal International Ltd.", category: "Sellos Mecánicos", year: "2025" },
            { id: "pac-seal", filename: "PRECIOS SELLOS PAC SEAL OCTUBRE 2025.pdf", title: "Lista de Productos Pac-Seal", company: "Pac-Seal S.A. Industrial", category: "Sellos Mecánicos", year: "2025" },
            { id: "refrigeracion", filename: "REFRIGERACION Y ELECTRICOS P.D..pdf", title: "Lista de Productos Refrigeración y Eléctricos P.D.", company: "P.D. Refrigeración y Eléctricos", category: "Refrigeración", year: "2025" }
        ];

        CATALOGS_DATABASE.sort((a, b) => a.title.localeCompare(b.title));
        let catalogs = [...CATALOGS_DATABASE];

        window.addEventListener('DOMContentLoaded', () => { renderCatalogsGrid(); });

        function renderCatalogsGrid(filtered = catalogs) {
            const grid = document.getElementById('catalogs-grid');
            grid.innerHTML = '';
            filtered.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-md border border-slate-200 flex flex-col justify-between hover:shadow-lg transition-all";
                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-start">
                            <span class="w-7 h-7 rounded-lg bg-brand-blueDark text-white flex items-center justify-center font-black text-xs shadow-sm">${index + 1}</span>
                            <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">${cat.year}</span>
                        </div>
                        <div>
                            <span class="text-[10px] font-bold text-brand-blueLight uppercase block mb-0.5">${cat.category}</span>
                            <h3 class="font-extrabold text-sm text-slate-800">${cat.title}</h3>
                            <div class="text-[11px] text-slate-500 mt-1.5 flex items-center gap-1.5 bg-slate-50 p-2 rounded-xl border border-slate-100">
                                <i class="fa-solid fa-building text-brand-blueLight text-[10px]"></i>
                                <span class="text-xs">Empresa: <strong class="text-brand-blueDark font-extrabold">${cat.company}</strong></span>
                            </div>
                            <p class="text-[10px] text-slate-400 font-mono mt-2 truncate block"><i class="fa-solid fa-file-pdf text-red-500 mr-1"></i>${cat.filename}</p>
                        </div>
                    </div>
                    <div class="mt-5 pt-3 border-t border-slate-100">
                        <button onclick="openPDFViewer('${cat.id}')" class="w-full py-2.5 bg-brand-blueDark hover:bg-brand-orange text-white font-extrabold text-xs rounded-xl shadow-md flex items-center justify-center gap-2 transition-all">
                            <i class="fa-solid fa-eye"></i> Abrir Catálogo
                        </button>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function filterCatalogs() {
            const query = document.getElementById('catalog-search').value.toLowerCase().trim();
            const filtered = catalogs.filter(cat => cat.title.toLowerCase().includes(query) || cat.company.toLowerCase().includes(query));
            renderCatalogsGrid(filtered);
        }

        function openPDFViewer(id) {
            const cat = catalogs.find(c => c.id === id);
            if (!cat) return;

            document.getElementById('viewer-title').textContent = cat.title;
            document.getElementById('viewer-filename').textContent = cat.filename;

            // Codificación ultra-segura de la URL del PDF
            const cleanUrl = encodeURIComponent(cat.filename).replace(/%2F/g, '/');
            const fullUrl = cleanUrl + '?v=' + Date.now();

            document.getElementById('btn-direct-link').href = fullUrl;

            const container = document.getElementById('pdf-container');
            container.innerHTML = `<iframe src="${fullUrl}" class="w-full h-full border-0"></iframe>`;

            document.getElementById('pdf-viewer-overlay').classList.remove('hidden');
        }

        function closePDFViewer() {
            document.getElementById('pdf-viewer-overlay').classList.add('hidden');
            document.getElementById('pdf-container').innerHTML = '';
        }
    </script>
</body>
</html>
